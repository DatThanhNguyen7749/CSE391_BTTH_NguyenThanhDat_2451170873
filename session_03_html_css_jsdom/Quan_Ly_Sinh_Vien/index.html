<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>BTTH03 - Quản lý sinh viên</title>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar bg-body-tertiary">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold">📚 Quản lý sinh viên</a>
    </div>
</nav>

<div class="container mt-4">

    <!-- THÔNG BÁO -->
    <div id="thongBao" class="alert d-none" role="alert"></div>

    <!-- THỐNG KÊ -->
    <div class="row mb-3">
        <div class="col-md-4">
            <div class="card text-white bg-primary mb-2">
                <div class="card-body py-2">
                    <h6 class="card-title mb-0">Tổng số sinh viên: <span id="tongSV" class="fw-bold">0</span></h6>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success mb-2">
                <div class="card-body py-2">
                    <h6 class="card-title mb-0">Điểm TB cả lớp: <span id="diemTB" class="fw-bold">0</span></h6>
                </div>
            </div>
        </div>
    </div>

    <!-- NÚT THÊM -->
    <div class="mb-3 text-end">
        <button type="button" class="btn btn-success btn-lg" id="btnMoForm">+ Thêm sinh viên</button>
    </div>

    <!-- BẢNG DANH SÁCH -->
    <table class="table table-bordered table-striped table-hover">
        <thead class="table-dark">
            <tr>
                <th>MSV</th>
                <th>Họ và tên</th>
                <th>Ngày sinh</th>
                <th>Lớp</th>
                <th>Điểm TB</th>
                <th>Email</th>
                <th>Thao tác</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- JS sẽ render vào đây -->
        </tbody>
    </table>

</div>


<!-- POPUP FORM THÊM / SỬA -->
<div class="modal-backdrop-custom" id="popupForm">
    <div class="modal-box">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 id="tieuDeForm" class="mb-0">Thêm sinh viên</h5>
            <button type="button" class="btn-close" id="btnDongForm"></button>
        </div>
        <form id="formSinhVien">
            <div class="mb-2">
                <label class="form-label">Mã sinh viên</label>
                <input type="text" class="form-control" id="inputMSV" placeholder="VD: SV001" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Họ và tên</label>
                <input type="text" class="form-control" id="inputHoTen" placeholder="VD: Nguyễn Văn A" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Ngày sinh</label>
                <input type="date" class="form-control" id="inputNgaySinh" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Lớp học</label>
                <input type="text" class="form-control" id="inputLop" placeholder="VD: 66KTPM2" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Điểm trung bình</label>
                <input type="number" class="form-control" id="inputDiem" placeholder="VD: 8.5" min="0" max="10" step="0.1" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="inputEmail" placeholder="VD: abc@gmail.com" required>
            </div>
            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-secondary" id="btnHuy">Hủy</button>
                <button type="submit" class="btn btn-primary" id="btnLuu">Lưu</button>
            </div>
        </form>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
<script src="main.js"></script>

</body>
</html>
